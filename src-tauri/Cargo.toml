[package]
name = "llm-status-board"
version = "0.1.4"
description = "LLM 提供商余额与用量聚合看板"
authors = ["Steve Gou"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "socks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2.8.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
