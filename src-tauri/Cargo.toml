[package]
name = "llm-status-board"
version = "0.2.13"
description = "LLM 提供商余额与用量聚合看板"
authors = ["Steve Gou"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
time = { version = "0.3", features = ["formatting"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "socks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-notification = "2.7.0"
# R22 一键更新：updater（检查/下载/安装）+ process（安装后 relaunch）+ opener（兜底打开发布页）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
