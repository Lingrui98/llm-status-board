name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 注意：本仓库根目录就是 llm-status-board 项目本身（package.json / src-tauri 都在根下），
# 不要再给各步骤加 llm-status-board/ 前缀的 working-directory 或 projectPath。
jobs:
  # 先创建**唯一**的 draft release，矩阵构建统一往这里传产物。
  # 为什么需要它：v0.2.5 发版时三个矩阵 job 并发「找不到 release 就各自创建」，
  # 竞态产生了两个 draft（latest.json 被拆成两半，手工合并修复）。
  # tauri-action 生成 latest.json 时会合并 release 里已有资产，
  # 只要所有 job 指向同一个 releaseId，最终清单必然是完整三平台。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases \
            -f tag_name="${{ github.ref_name }}" \
            -f name="LLM Status Board ${{ github.ref_name }}" \
            -f body="Win / macOS 安装包见 Assets。" \
            -F draft=true -F prerelease=false --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        run: npm ci --no-fund --no-audit

      # macOS 签名（可选）：在 repo Settings → Secrets 配置后取消注释
      # - name: Import signing certificate
      #   if: matrix.platform == 'macos-latest'
      #   uses: apple-actions/import-codesign-certs@v3
      #   with:
      #     p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
      #     p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          # R22 一键更新签名（必需）：tauri-action 检测到私钥后会自动给 updater 产物签名，
          # 生成 latest.json 并随 draft release 上传（配 `tauri.conf.json` 的 plugins.updater）。
          # 在 repo Settings → Secrets and variables → Actions 配置以下两项后本功能生效：
          # - TAURI_SIGNING_PRIVATE_KEY：更新签名私钥（tauri signer generate 生成，**绝不可入库**）
          # - TAURI_SIGNING_PRIVATE_KEY_PASSWORD：私钥密码
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 签名/公证（可选）
          # APPLE_CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 统一上传到 prepare 阶段创建的唯一 draft（防矩阵并发创建重复 release 的竞态）
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
