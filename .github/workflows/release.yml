name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "New v* tag; the selected ref must contain docs/releases/<tag>.md."
        required: true
        type: string
  workflow_call:
    inputs:
      release_id:
        description: "Existing draft release ID used by nightly; empty for stable releases."
        required: false
        default: ""
        type: string
      version:
        description: "Optional checkout-only version override used by nightly."
        required: false
        default: ""
        type: string

permissions:
  contents: write

# 本仓库根目录就是项目根目录，不要增加 llm-status-board/ working-directory 前缀。
# 稳定版继续创建 draft，由维护者手工发布，端点为 releases/latest/download/latest.json。
# nightly.yml 通过 workflow_call 复用本矩阵，端点为 releases/download/nightly/latest.json。
# 两种发布都复用 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD。
jobs:
  # 稳定版在这里创建唯一 draft。nightly 调用方传入已创建的 draft ID。
  # 三个矩阵任务始终上传同一 releaseId，避免重复 release 拆分 latest.json。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout stable release metadata
        if: ${{ ! inputs.release_id }}
        uses: actions/checkout@v4

      - name: Resolve release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          if [ -n "$INPUT_RELEASE_ID" ]; then
            id="$INPUT_RELEASE_ID"
          else
            if [[ ! "$TAG_NAME" =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "Stable releases require a v* tag name." >&2
              exit 1
            fi
            notes_file="docs/releases/${TAG_NAME}.md"
            if [ ! -f "$notes_file" ]; then
              echo "Missing release notes: ${notes_file}" >&2
              exit 1
            fi
            first_line="$(sed -n '1p' "$notes_file")"
            second_line="$(sed -n '2p' "$notes_file")"
            if [[ "$first_line" != "# ${TAG_NAME} "* ]] || [ -n "$second_line" ]; then
              echo "Expected '# <tag> — <summary>', a blank second line, and Markdown body." >&2
              exit 1
            fi
            release_name="${first_line#\# }"
            release_body="$(tail -n +3 "$notes_file")"
            if [ -z "$release_body" ]; then
              echo "Release notes body is empty." >&2
              exit 1
            fi
            id="$(gh api "repos/${REPOSITORY}/releases" \
              -f tag_name="$TAG_NAME" \
              -f name="$release_name" \
              -f body="$release_body" \
              -f target_commitish="$GITHUB_SHA" \
              -F draft=true -F prerelease=false --jq .id)"
          fi
          if [[ ! "$id" =~ ^[0-9]+$ ]]; then
            echo "Invalid release ID." >&2
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 只修改本次 checkout。nightly 版本不会回写仓库或改变稳定版配置。
      - name: Set nightly version in checkout
        if: inputs.version
        env:
          NIGHTLY_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const fs = require("fs"); const file = "src-tauri/tauri.conf.json"; const config = JSON.parse(fs.readFileSync(file, "utf8")); const version = process.env.NIGHTLY_VERSION; if (!version) throw new Error("Missing nightly version"); config.version = version; fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");'

      - name: Install frontend deps
        run: npm ci --no-fund --no-audit

      # macOS 签名（可选）：在 repo Settings → Secrets 配置后取消注释
      # - name: Import signing certificate
      #   if: matrix.platform == 'macos-latest'
      #   uses: apple-actions/import-codesign-certs@v3
      #   with:
      #     p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
      #     p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action 使用私钥签名 updater 产物，并生成、合并和上传 latest.json。
          # 在 repo Settings → Secrets and variables → Actions 配置以下两项：
          # - TAURI_SIGNING_PRIVATE_KEY：更新签名私钥（tauri signer generate 生成，绝不可入库）
          # - TAURI_SIGNING_PRIVATE_KEY_PASSWORD：私钥密码
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 签名/公证（可选）
          # APPLE_CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 所有平台写入 prepare 解析出的同一 release，tauri-action 合并 updater 清单。
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
